name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The compiler these sources were written for: the commit pinned in
      # cancho.toml, read from there so there is one place to change it.
      - name: Read the compiler pin
        id: pin
        run: echo "rev=$(sed -n 's/^cancho = "\([0-9a-f]*\)".*/\1/p' cancho.toml)" >> "$GITHUB_OUTPUT"

      - name: Cache the compiler
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/cancho-bin
          key: cancho-${{ steps.pin.outputs.rev }}-ubuntu-24.04

      - name: Check out cancho
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: alpibrusl/cancho
          ref: ${{ steps.pin.outputs.rev }}
          path: cancho

      - name: Build cancho
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd cancho
          cargo build --release -p cancho
          mkdir -p ~/cancho-bin
          cp target/release/cancho ~/cancho-bin/

      # tests/chat.sh renders the model's chat template through jinja2 as its oracle.
      - name: jinja2
        run: sudo apt-get install -y python3-jinja2

      # tests/media_video.sh's oracle (tools/media.py) resizes a picture with Pillow and numpy. They go in an
      # environment of their own (MEDIA_ORACLE_PY), not the system's python3: with numpy there, tests/oracles.py
      # runs tools/sampler_dump.py, whose exp is numpy's and on this runner moves a top_p = 1 cut (docs/native.md N2f).
      - name: Pillow and numpy for the media oracle
        run: |
          python3 -m venv ~/media-oracle
          ~/media-oracle/bin/pip install -q pillow numpy

      # cancho-gpu-front's checks (tests/front.sh) build it against the stores its locks pin: cancho's packages at the compiler's pin,
      # cancho-web and cancho-schema at front/deps/revs.
      - name: Read the front's pins
        id: front
        run: |
          echo "web=$(sed -n 's/^CANCHO_WEB_REV=//p' front/deps/revs)" >> "$GITHUB_OUTPUT"
          echo "schema=$(sed -n 's/^CANCHO_SCHEMA_REV=//p' front/deps/revs)" >> "$GITHUB_OUTPUT"

      - name: Check out cancho's packages
        uses: actions/checkout@v4
        with:
          repository: alpibrusl/cancho
          ref: ${{ steps.pin.outputs.rev }}
          path: deps/cancho
          sparse-checkout: packages

      - name: Check out cancho-web
        uses: actions/checkout@v4
        with:
          repository: alpibrusl/cancho-web
          ref: ${{ steps.front.outputs.web }}
          path: deps/cancho-web

      - name: Check out cancho-schema
        uses: actions/checkout@v4
        with:
          repository: alpibrusl/cancho-schema
          ref: ${{ steps.front.outputs.schema }}
          path: deps/cancho-schema

      - name: Gate
        run: >-
          CANCHO=~/cancho-bin/cancho MEDIA_ORACLE_PY=~/media-oracle/bin/python
          FRONT_REQUIRED=1 CANCHO_DIR=$PWD/deps/cancho WEB_DIR=$PWD/deps/cancho-web SCHEMA_DIR=$PWD/deps/cancho-schema
          scripts/gate.sh

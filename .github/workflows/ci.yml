name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The compiler these sources were written for: the commit pinned in
      # cancho.toml, read from there so there is one place to change it.
      - name: Read the compiler pin
        id: pin
        run: echo "rev=$(sed -n 's/^cancho = "\([0-9a-f]*\)".*/\1/p' cancho.toml)" >> "$GITHUB_OUTPUT"

      - name: Cache the compiler
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/cancho-bin
          key: cancho-${{ steps.pin.outputs.rev }}-ubuntu-24.04

      - name: Check out cancho
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: alpibrusl/cancho
          ref: ${{ steps.pin.outputs.rev }}
          path: cancho

      - name: Build cancho
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd cancho
          cargo build --release -p cancho
          mkdir -p ~/cancho-bin
          cp target/release/cancho ~/cancho-bin/

      - name: Gate
        run: CANCHO=~/cancho-bin/cancho scripts/gate.sh

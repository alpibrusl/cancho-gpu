name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The compiler these sources were written for: the release pinned in
      # cancho.toml, read from there so there is one place to change it, and
      # installed prebuilt.
      - name: Install the pinned compiler
        run: |
          pin=$(sed -n 's/^cancho *= *"\([0-9a-f.]*\)".*/\1/p' cancho.toml)
          test -n "$pin" || { echo "cancho.toml has no compiler pin" >&2; exit 1; }
          curl -fsSL https://raw.githubusercontent.com/alpibrusl/cancho/main/scripts/install.sh | sh -s "$pin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # tests/chat.sh renders the model's chat template through jinja2 as its oracle.
      - name: jinja2
        run: sudo apt-get install -y python3-jinja2

      # tests/media_video.sh's oracle (tools/media.py) resizes a picture with Pillow and numpy. They go in an
      # environment of their own (MEDIA_ORACLE_PY), not the system's python3: with numpy there, tests/oracles.py
      # runs tools/sampler_dump.py, whose exp is numpy's and on this runner moves a top_p = 1 cut (docs/native.md N2f).
      - name: Pillow and numpy for the media oracle
        run: |
          python3 -m venv ~/media-oracle
          ~/media-oracle/bin/pip install -q pillow numpy

      - name: Gate
        run: CANCHO=$HOME/.local/bin/cancho MEDIA_ORACLE_PY=~/media-oracle/bin/python scripts/gate.sh

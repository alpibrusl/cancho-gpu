[package]
name = "cancho-gpu"
cancho = "0.1.1"   # the compiler release these sources were written for (CI installs it prebuilt)

[[bin]]
name = "cancho-gpu"
sources = ["src"]
std = true
out = "build/cancho-gpu"

[[test]]
name = "unit"
sources = ["tests/unit_test.cho", "src/mem.cho", "src/text.cho", "src/err.cho", "src/f32.cho"]
std = true
